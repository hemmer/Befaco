name: Build VCV Rack Plugin

on:
  push:
    branches: [v2-builds]
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rack-sdk-version: 2.6.4
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.rack-plugin-toolchain-dir }}/plugin-build
          name: ${{ matrix.platform }}

  build-mac:
    name: mac
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get Rack-SDK
        run: |
          pushd $HOME
          curl -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.platform }}.zip
          unzip Rack-SDK.zip
      - name: Build plugin
        run: |
          CROSS_COMPILE_TARGET_x64=x86_64-apple-darwin
          CROSS_COMPILE_TARGET_arm64=arm64-apple-darwin
          export RACK_DIR=$HOME/Rack-SDK
          export CROSS_COMPILE=$CROSS_COMPILE_TARGET_${{ matrix.platform }}
          make dep
          make dist
          echo "Plugin architecture '$(lipo -archs plugin.dylib)'"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.vcvplugin
          name: mac-${{ matrix.platform }}

  publish:
    name: Publish plugin
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2-builds'
    runs-on: ubuntu-latest
    needs: [build, build-mac]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Replace latest development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' artifacts < <(find _artifacts -type f -name '*.vcvplugin' -print0)
          test "${#artifacts[@]}" -gt 0
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${artifacts[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development Build" \
            --notes "Automated build of $GITHUB_SHA from v2-builds."
